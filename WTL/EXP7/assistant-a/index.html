<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker - Assistant A (Modular OOP)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-content">
                <h1>💰 FinanceFlow Tracker</h1>
                <p class="subtitle">Implementation A: Modular Class-Based Architecture</p>
            </div>
            <span class="assistant-badge">Assistant A: GitHub Copilot Style</span>
        </header>

        <!-- KPI Metrics Grid -->
        <section class="metrics-grid" aria-label="Financial Summary Cards">
            <div class="metric-card balance-card">
                <span class="metric-label">Net Balance</span>
                <span class="metric-val" id="netBalance">$0.00</span>
            </div>
            <div class="metric-card income-card">
                <span class="metric-label">Total Income</span>
                <span class="metric-val text-green" id="totalIncome">+$0.00</span>
            </div>
            <div class="metric-card expense-card">
                <span class="metric-label">Total Expenses</span>
                <span class="metric-val text-red" id="totalExpense">-$0.00</span>
            </div>
        </section>

        <!-- Main Workspace -->
        <main class="main-layout">
            <!-- Add Transaction Section -->
            <section class="card form-section" aria-labelledby="form-heading">
                <h2 id="form-heading">Add Transaction</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" placeholder="e.g. Salary, Groceries, Internet" required />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required />
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type" required>
                                <option value="income">Income (+)</option>
                                <option value="expense">Expense (-)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Salary">Salary / Stipend</option>
                            <option value="Food">Food &amp; Dining</option>
                            <option value="Utilities">Utilities &amp; Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education &amp; Books</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="addBtn">+ Add Transaction</button>
                </form>
            </section>

            <!-- Transactions List Section -->
            <section class="card list-section" aria-labelledby="list-heading">
                <div class="list-header">
                    <h2 id="list-heading">Transaction History</h2>
                    <div class="filter-box">
                        <label for="categoryFilter" class="sr-only">Filter by category</label>
                        <select id="categoryFilter" aria-label="Filter transactions by category">
                            <option value="all">All Categories</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food &amp; Dining</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="transaction-table-wrapper">
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th class="text-right">Amount</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                    <div class="empty-state hidden" id="emptyState">
                        <p>No transactions found for this filter.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
