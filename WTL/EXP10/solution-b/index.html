<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Quiz Engine - Solution B (Reactive Glassmorphism)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-nebula"></div>

    <div class="assessment-viewport">
        <!-- Top Navigation -->
        <header class="assessment-header">
            <div class="brand">
                <span class="brand-badge">⚡ NEXUS</span>
                <div>
                    <h1>Web Dev Assessment Lab</h1>
                    <p class="tagline">Solution B: Functional Reactive State &amp; Glassmorphism</p>
                </div>
            </div>
            
            <div class="header-stats">
                <div class="streak-pill" id="streakPill">🔥 Streak: 0</div>
                <div class="timer-dial" id="timerDial">
                    <span class="timer-countdown" id="timerValue">30s</span>
                </div>
            </div>
        </header>

        <!-- Progress Tracker Bar -->
        <div class="track-wrapper">
            <div class="track-header">
                <span id="qIndicator">Question 1 / 5</span>
                <span id="scoreTracker" class="text-glow">Score: 0 XP</span>
            </div>
            <div class="track-bar">
                <div class="track-fill" id="trackFill"></div>
            </div>
        </div>

        <!-- Question Viewport Card -->
        <main class="glass-card quiz-stage" id="quizStage">
            <div class="q-meta">
                <span class="cat-tag" id="qCategory">HTML5 &amp; Semantic Web</span>
                <span class="diff-tag">Intermediate</span>
            </div>
            <h2 id="qText" class="question-prompt">Loading question...</h2>

            <div class="options-stream" id="optionsStream">
                <!-- Injected via state engine -->
            </div>

            <div class="stage-footer">
                <div class="feedback-banner hidden" id="feedbackBanner"></div>
                <button class="glow-next-btn hidden" id="nextActionBtn">
                    <span>Continue</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </main>

        <!-- Result Canvas -->
        <section class="glass-card result-stage hidden" id="resultStage">
            <div class="score-orb">
                <div class="orb-inner">
                    <span class="orb-number" id="orbPercent">100%</span>
                    <span class="orb-label">Mastery</span>
                </div>
            </div>
            <h2 id="resultHeading" class="result-title">Evaluation Finalized</h2>
            <p id="resultBlurb" class="result-blurb">Summary of performance metrics.</p>

            <div class="result-buttons">
                <button class="pill-btn secondary" id="reviewTriggerBtn">Detailed Review</button>
                <button class="pill-btn primary" id="retryTriggerBtn">Re-run Assessment</button>
            </div>

            <div class="review-ledger hidden" id="reviewLedger">
                <!-- Populated dynamically -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
